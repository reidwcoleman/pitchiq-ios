name: PitchIQ
options:
  bundleIdPrefix: com.reidcoleman
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JU6MZ954WS
    SWIFT_VERSION: "5.0"
  configs:
    # Debug is optimised too, deliberately.
    #
    # Nobody steps through this app in a debugger — it is diagnosed with
    # `-verbose` prints — and unoptimised Swift runs the projection and the
    # planner about fifteen times slower: measured, 3,821 ms of compute against
    # 146 ms for the same work with `-O`. A debug build installed on a phone
    # took four seconds to draw a team. That is not a trade worth having
    # available to make by accident.
    debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"
targets:
  PitchIQ:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidcoleman.PitchIQ
        PRODUCT_NAME: PitchIQ
        DEVELOPMENT_TEAM: JU6MZ954WS
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
